<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STL Viewer</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />

<!-- Tells the browser where to find the "three" package when app.js does `import * as THREE from "three"` -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

  <div id="app">
    <header>
      <div>
        <div class="title">STL Viewer</div>
        <div class="tagline">Drag to orbit &middot; Shift-drag or right-drag to pan &middot; Scroll to zoom</div>
      </div>
      <div class="header-actions">
        <label class="btn" for="file-input">
          <span id="upload-label">Upload STL / STEP</span>
          <input id="file-input" type="file" style="display:none" />
        </label>
        <button class="btn btn-primary" id="screenshot-btn" disabled>Save screenshot</button>
      </div>
    </header>

    <div class="main">
      <div class="viewport" id="viewport">
        <div id="three-mount"></div>

        <div class="dropzone-hint" id="dropzone-hint">
          <div class="dropzone-box">
            <div class="dropzone-text">Drop an .stl, .stp, or .step file here, or use Upload above</div>
          </div>
        </div>

        <div class="loading" id="loading" style="display:none">Parsing model&hellip;</div>
        <div class="error-banner" id="error-banner" style="display:none"></div>
      </div>

      <div class="sidebar">
        <div>
          <div class="section-label">Axis scale</div>

          <div class="axis-row" data-axis="x">
            <div class="axis-head">
              <span class="axis-name" style="color:var(--axis-x)">X</span>
              <input class="num-input" type="number" step="0.01" min="0.01" value="1" disabled />
            </div>
            <input class="range-input" type="range" min="0.05" max="10" step="0.01" value="1" style="--thumb-color:var(--axis-x)" disabled />
          </div>

          <div class="axis-row" data-axis="y">
            <div class="axis-head">
              <span class="axis-name" style="color:var(--axis-y)">Y</span>
              <input class="num-input" type="number" step="0.01" min="0.01" value="1" disabled />
            </div>
            <input class="range-input" type="range" min="0.05" max="10" step="0.01" value="1" style="--thumb-color:var(--axis-y)" disabled />
          </div>

          <div class="axis-row" data-axis="z">
            <div class="axis-head">
              <span class="axis-name" style="color:var(--axis-z)">Z</span>
              <input class="num-input" type="number" step="0.01" min="0.01" value="1" disabled />
            </div>
            <input class="range-input" type="range" min="0.05" max="10" step="0.01" value="1" style="--thumb-color:var(--axis-z)" disabled />
          </div>

          <button class="btn full" id="lock-btn">Lock axes together</button>
        </div>

        <div id="dims-section" style="display:none">
          <div class="section-label">Dimensions</div>
          <div class="dims-box" id="dims-box"></div>
        </div>

        <div class="two-col">
          <button class="btn" id="reset-btn" disabled>Reset</button>
          <button class="btn" id="fit-btn" disabled>Fit view</button>
        </div>

        <div>
          <div class="section-label">Background</div>
          <div class="bg-row">
            <button class="btn bg-btn active" data-bg="dark">dark</button>
            <button class="btn bg-btn" data-bg="light">light</button>
            <button class="btn bg-btn" data-bg="transparent">transparent</button>
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="grid-toggle" checked />
          Show reference grid
        </label>

        <div class="filename" id="filename-display"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
